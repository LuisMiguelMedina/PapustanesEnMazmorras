name: Deploy PayPal Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Deploy functions
        run: npx firebase-tools@14.5.0 deploy --only functions --non-interactive --project multiverseofmadness21-fefd9
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
