name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Build for GitHub Pages
      run: npm run build:gh-pages
      env:
        GITHUB_PAGES: 'true'
        VITE_PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}

    - name: Sync built site to repo root (legacy project Pages)
      run: |
        cp dist/index.html index.html
        rm -rf assets
        cp -r dist/assets assets
        cp dist/404.html 404.html
        cp dist/.nojekyll .nojekyll
        rm -rf foundry
        cp -r dist/foundry foundry
        if [ -d dist/team-media ]; then
          rm -rf team-media
          cp -r dist/team-media team-media
        fi
        cp dist/favicon* . 2>/dev/null || true
        cp dist/apple-touch-icon.png . 2>/dev/null || true
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --staged --quiet; then
          echo "No production files to publish"
        else
          git commit -m "chore(pages): publish production build [skip ci]"
          git push
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'

  deploy:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
